[package]
name = "gaze-preview"
version = "0.1.0"
edition = "2021"
description = "Native Windows gaze preview for the Tobii Eye Tracker 5"

[dependencies]
libloading = "0.8"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
